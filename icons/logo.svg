<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2550"/>
      <stop offset="0.55" stop-color="#0d1120"/>
      <stop offset="1" stop-color="#2a1d05"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c98a00"/>
      <stop offset="0.5" stop-color="#f0b90b"/>
      <stop offset="1" stop-color="#ffe08a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#f0b90b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f0b90b" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- grille -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3">
    <line x1="64" y1="160" x2="448" y2="160"/><line x1="64" y1="256" x2="448" y2="256"/><line x1="64" y1="352" x2="448" y2="352"/>
  </g>
  <!-- bougies -->
  <g filter="url(#sh)">
    <line x1="132" y1="300" x2="132" y2="420" stroke="#ea3943" stroke-width="10" stroke-linecap="round"/>
    <rect x="108" y="322" width="48" height="74" rx="10" fill="#ea3943"/>
    <line x1="212" y1="246" x2="212" y2="392" stroke="#16c784" stroke-width="10" stroke-linecap="round"/>
    <rect x="188" y="270" width="48" height="96" rx="10" fill="#16c784"/>
    <line x1="292" y1="200" x2="292" y2="340" stroke="#16c784" stroke-width="10" stroke-linecap="round"/>
    <rect x="268" y="222" width="48" height="94" rx="10" fill="#16c784"/>
    <line x1="372" y1="142" x2="372" y2="290" stroke="#16c784" stroke-width="10" stroke-linecap="round"/>
    <rect x="348" y="166" width="48" height="100" rx="10" fill="#16c784"/>
  </g>
  <!-- flèche dorée -->
  <g filter="url(#sh)">
    <polyline points="84,388 196,300 276,328 410,170" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="440,118 446,236 356,160" fill="url(#gold)" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
