name: Appli Android (APK)

# Fabrique l'APK de Trad Center (appli de confiance TWA : elle affiche le site, donc le jeu se met à jour tout seul).
# L'APK est publié dans la release « android » : https://github.com/nono-rsb/trad-center/releases/download/android/trad-center.apk
# Lancé quand le dossier android/ change, ou à la main. Le jeu n'a pas besoin de nouvel APK à chaque mise à jour.
# La clé de signature est créée une seule fois, chiffrée avec le secret PUSH_SECRET et rangée sur la branche apk-key :
# ainsi chaque nouvel APK a la même signature et s'installe par-dessus l'ancien.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clé de signature (créée une fois, chiffrée avec PUSH_SECRET)
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: |
          set -e
          test -n "$PUSH_SECRET" || { echo "Secret PUSH_SECRET manquant"; exit 1; }
          PASS=$(printf 'tc-apk-%s' "$PUSH_SECRET" | sha256sum | cut -c1-32)
          echo "::add-mask::$PASS"
          echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "KS_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          if git fetch -q origin apk-key 2>/dev/null; then
            git show origin/apk-key:release.keystore.enc > "$RUNNER_TEMP/ks.enc"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$RUNNER_TEMP/ks.enc" -out "$RUNNER_TEMP/release.keystore" -pass pass:"$PASS"
            echo "Clé de signature existante restaurée."
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$PASS" -keypass "$PASS" -alias tradcenter -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Trad Center, O=Trad Center, C=FR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$RUNNER_TEMP/release.keystore" -out "$RUNNER_TEMP/ks.enc" -pass pass:"$PASS"
            K="$RUNNER_TEMP/keybranch"; mkdir -p "$K"; cd "$K"
            git init -q; git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git checkout -q --orphan apk-key; cp "$RUNNER_TEMP/ks.enc" release.keystore.enc
            git add release.keystore.enc; git commit -qm "Clé de signature de l'appli Android (chiffrée)"; git push -q origin apk-key
            echo "Nouvelle clé de signature créée et rangée (chiffrée)."
          fi
      - name: Compiler l'APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Empreinte de la clé (pour le plein écran, voir android/README.md)
        run: |
          FP=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KS_PASS" -alias tradcenter | grep 'SHA256:' | sed 's/.*SHA256: *//')
          echo "SHA-256 : $FP"
          { echo "### Empreinte SHA-256 de la clé de l'appli"; echo; echo "\`$FP\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier dans la release « android »
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk trad-center.apk
          gh release delete android --cleanup-tag -y 2>/dev/null || true
          gh release create android trad-center.apk --target main --latest=false --title "$APK_CODE" --notes "Appli Android Trad Center, version $APK_CODE. Le jeu se met à jour tout seul : cet APK ne change presque jamais."
          echo "APK publié : https://github.com/${GITHUB_REPOSITORY}/releases/download/android/trad-center.apk"
