name: Notifications push

# Serveur de notifications : envois d'argent, demandes d'ami, gros mouvements de marché, alertes de prix.
# Exécutions courtes et planifiées (pas de serveur permanent) : chaque passage surveille ~4 min.
# Seul réglage : le secret PUSH_SECRET (un mot de passe inventé), voir NOTIFICATIONS.md.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write # pour publier les questions des joueurs sur la branche qa-inbox (lue par Claude)

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mémoire (anti-doublons)
        uses: actions/cache/restore@v4
        with:
          path: scripts/state.json
          key: notify-state-${{ github.run_id }}
          restore-keys: notify-state-
      - name: Installer
        working-directory: scripts
        run: npm install --no-save --no-audit --no-fund firebase@10.14.1 web-push@3.6.7
      - name: Envoyer les notifications
        run: node scripts/notify.mjs
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          LOOP_MINUTES: '4'
      - name: Sauver la mémoire
        if: always() && hashFiles('scripts/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: scripts/state.json
          key: notify-state-${{ github.run_id }}
      - name: Questions des joueurs → branche qa-inbox (lue par Claude)
        if: always() && hashFiles('scripts/qa-inbox.json') != ''
        run: |
          cp scripts/qa-inbox.json "$RUNNER_TEMP/questions.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin qa-inbox 2>/dev/null; then git checkout -q -B qa-inbox origin/qa-inbox; else git checkout -q --orphan qa-inbox && git rm -rq --cached . && git clean -fdq -e scripts; fi
          cp "$RUNNER_TEMP/questions.json" questions.json
          git add questions.json
          git diff --cached --quiet || { git commit -qm "Questions des joueurs (anonymes)" && git push -q origin qa-inbox; }
