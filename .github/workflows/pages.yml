name: Publier le jeu sur GitHub Pages

# Copie le site sur la branche gh-pages à chaque push sur main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pousser sur gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached .github >/dev/null
          rm -rf .github
          git commit -qm "Publication du jeu (${GITHUB_SHA::7})"
          git push -f origin gh-pages-tmp:gh-pages
