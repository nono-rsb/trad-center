plugins { id 'com.android.application' }

// versionCode = numéro de la compilation (voir .github/workflows/android.yml) : il ne fait que monter
def apkCode = (System.getenv('APK_CODE') ?: '1') as int

android {
    namespace 'fr.tradcenter.app'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.tradcenter.app'
        minSdk 23
        targetSdk 34
        versionCode apkCode
        versionName "1.${apkCode}"
        // adresse du jeu : l'appli ouvre toujours la dernière version publiée, aucune mise à jour du jeu à installer
        manifestPlaceholders = [apkCode: "${apkCode}"]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'missing.keystore')
            storePassword System.getenv('KS_PASS')
            keyAlias 'tradcenter'
            keyPassword System.getenv('KS_PASS')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
